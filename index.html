function arrest(){const ox=p.x,oy=p.y,oz=p.z;cops.forEach((c,i)=>{const x=ox+(i?-2:2.2),z=oz+2.8;c.position.set(x,H(x,z),z);c.rotation.y=Math.atan2(ox-x,oz-z)});

const QS=[{q:'Defendant, how did you come to be on this island?',r:'My airplane lost its engine and I parachuted down.',w:'I sneaked in on a smuggler boat.'},{q:'Why did you go to the harbor?',r:'I wanted to ask for help and report what happened.',w:'I planned to steal a boat and escape.'},{q:'Did you harm anyone or damage property on the island?',r:'No. I only gathered wood and stone to survive.',w:'Yes, I wrecked things just for fun.'}];

function reply(i,ok){$('ans').innerHTML='';DC();say('You',QS[i][ok?'r':'w'],()=>{if(!ok)return verdict(0);if(i==QS.length-1)return verdict(1);JC();say('Judge','Very well. Next question.',()=>trial(i+1))})}
function verdict(w){JC();if(w)say('Judge','The court finds you not guilty. The case is dismissed. You are free to go.',()=>say('You','Thank you, your honor. I just want to go home.',()=>say('Police','Sorry for the trouble. Safe travels.',win)));else say('Judge','The court finds you guilty. The sentence is the electric chair.',()=>say('Police','Take him away.',chair))}

 const t0=performance.now(),f=()=>{$('fl').style.opacity=Math.random()<.5?.9:0;RM.EL.intensity=Math.random()*4;if(performance.now()-t0<1800)requestAnimationFrame(f);else{$('fl').style.opacity=0;RM.EL.intensity=1.2;lost()}};f()})}
function lost(){lb(0);$('sub').innerHTML='';show('<h2 style="color:#e5484d">GAME OVER</h2><p>You gave the wrong answer and the court sentenced you. Tell the truth next time!</p><button onclick="show(\'\');trial(0)">Try the trial again</button><button onclick="menu()">Main menu</button>')}
function win(){lb(0);$('sub').innerHTML='';mi=MS.length;copsHome();show(`<h2 style="color:#46c46e">YOU WIN!</h2><p>The judge set you free. You survived the island, reached the harbor and told the truth.</p><button onclick="resume()">Keep exploring the island</button><button onclick="menu()">Main menu</button>${CRED}`)}
// ---------- input ----------
addEventListener('keydown',e=>{K[e.code]=true;if(state=='cut'&&CUT&&e.code=='Enter'){CUT.sd=true;CUT.t0-=99999;window.speechSynthesis&&speechSynthesis.cancel()}if(state=='play'){if(e.code=='Tab'){e.preventDefault();craftUI()}if(e.code=='KeyC')craftUI();if(e.code=='KeyV')tp=!tp;if(e.code=='KeyM')mapUI();if(e.code=='KeyB')boatKey();if(e.code=='KeyF'&&mode=='creative'){p.fly=!p.fly;p.vy=0}if(/^Digit[1-7]$/.test(e.code))sel=+e.code[5]-1}else if(state=='panel'&&(e.code=='KeyC'||e.code=='Tab'||e.code=='KeyM')){e.preventDefault();resume()}});
addEventListener('keyup',e=>K[e.code]=false);
addEventListener('mousemove',e=>{if(state=='play'&&document.pointerLockElement){p.yaw-=e.movementX*.0024;p.pitch=cl(p.pitch-e.movementY*.0024,-1.5,1.5)}});
addEventListener('wheel',e=>{if(state=='play')sel=(sel+(e.deltaY>0?1:6))%7});
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&state=='play'){save();pause()}});
addEventListener('mousedown',e=>{if(state!='play')return;if(!document.pointerLockElement){rd.domElement.requestPointerLock();return}e.button==0?act():e.button==2&&use()});
function drop(a){add('meat',{sheep:2,wolf:1,deer:3,chicken:1}[a.t])}
function act(){if(!TG)return;const o=TG;
 if(o.node){const n=o.node,d=D[n.t];if(d.need&&!inv[d.need]){toast('You need a '+N[d.need]+' (press C to craft)');return}n.hp-=1+(d.w&&inv[d.w]?2:0)+(d.need&&inv[d.need]?2:0);n.g.scale.setScalar(.5+.5*Math.max(0,n.hp)/d.hp);beep(180);
  if(n.hp<=0){add(d.i,d.n);if(d.x)add(d.x,1);if(d.i=='wood')st.wood+=d.n;G.n.remove(n.g);removed.add(n.i)}}
 else if(o.an){const a=o.an;a.hp-=2+(inv.sword?4:0);beep(120);a.tm=0;if(a.hp<=0){drop(a);G.a.remove(a.g);animals.splice(animals.indexOf(a),1)}}
 else if(o.key){const b=blocks.get(o.key);if(b){if(mode!='creative')add(b.t,1);del(o.key);beep(260)}}}
function use(){const it=HB[sel];if(it=='cooked'||it=='berry'){if(!inv[it])return;inv[it]--;P.hu=Math.min(100,P.hu+(it=='cooked'?35:10));P.hp=Math.min(100,P.hp+5);beep(400);return}
 if(!cell||!valid(cell)||!have(it))return;put(...cell,it);if(mode!='creative')inv[it]--;st.placed++;if(it=='torch')st.torch++;beep(300)}
function valid(c){if(blocks.has(key(...c)))return false;return!(Math.abs(c[0]-p.x)<.8&&Math.abs(c[2]-p.z)<.8&&c[1]+1>p.y&&c[1]<p.y+1.7)}
// ---------- simulation ----------
const rc=new T3.Raycaster(),pv=new T3.Mesh(bx,new T3.MeshBasicMaterial({color:0x00ff66,wireframe:true}));pv.scale.setScalar(1.02);pv.visible=false;sc.add(pv);
function blocked(x,y,z){for(const dx of[-.3,.3])for(const dz of[-.3,.3])for(const yy of[.55,1.2,1.6])if(blocks.has(key(Math.round(x+dx),Math.floor(y+yy),Math.round(z+dz))))return true;return false}
function gy(x,y,z){let g=H(x,z);const f=Math.floor(y+.6);for(let j=f;j>f-3;j--)if(blocks.has(key(Math.round(x),j,Math.round(z)))){g=Math.max(g,j+1);break}return g}
function die(){toast('You collapsed... and woke at the shore');P={hp:100,hu:60,sta:100};p.x=SP[0];p.z=SP[1];p.y=H(p.x,p.z);p.vy=0}
function upd(dt){st.time+=dt;
 const ph=(st.time%300)/300,sh=Math.sin(ph*6.283),k=cl(sh*2.5+.5,0,1),night=sh<0,c=new T3.Color(0x0a1026).lerp(new T3.Color(0xaab6bf),k);sc.background=c;sc.fog.color.copy(c);hemi.intensity=.25+.5*k;sun.intensity=.1+.8*k;sun.target.position.set(p.x,p.y,p.z);sun.position.set(p.x+Math.cos(ph*6.283)*50,p.y+Math.max(sh,.15)*50+10,p.z+20);
 const mx=(K.KeyD?1:0)-(K.KeyA?1:0),mz=(K.KeyS?1:0)-(K.KeyW?1:0),L=Math.hypot(mx,mz)||1,cr=mode=='creative';
 const spr=K.ShiftLeft&&(cr||P.sta>5)&&(mx||mz),inW=p.y<-.05;let sp=(spr?7.5:4.5)*(inW?.55:1)*(p.fly?2.2:1);
 const s=Math.sin(p.yaw),cc=Math.cos(p.yaw),vx=(mx*cc+mz*s)/L*sp,vz=(-mx*s+mz*cc)/L*sp;
 if(boat.on){const nx=p.x+vx*1.5*dt,nz=p.z+vz*1.5*dt;if(H(nx,nz)<-.3){p.x=nx;p.z=nz}}else{const nx=cl(p.x+vx*dt,-160,160),nz=cl(p.z+vz*dt,-160,160);if(!blocked(nx,p.y,p.z))p.x=nx;if(!blocked(p.x,p.y,nz))p.z=nz}
 if(boat.on){p.y=.1;p.vy=0}else if(p.fly)p.y+=((K.Space?1:0)-(K.ShiftLeft?1:0))*8*dt;else{
  const g0=gy(p.x,p.y,p.z),onG=p.y<=g0+.05;if(K.Space&&(onG||inW))p.vy=inW?3.5:7.5;p.vy=Math.max(p.vy-22*dt,inW?-2:-40);const vb=p.vy;p.y+=p.vy*dt;const g=gy(p.x,p.y,p.z);
  if(p.y<=g){p.y=g;if(vb<-15&&!cr){P.hp-=(-vb-15)*3;toast('Ouch!')}p.vy=0}
  if(blocked(p.x,p.y,p.z)&&p.vy>0){p.vy=0}}
 const eye=new T3.Vector3(p.x,p.y+1.6,p.z),fw=new T3.Vector3(-Math.sin(p.yaw)*Math.cos(p.pitch),Math.sin(p.pitch),-Math.cos(p.yaw)*Math.cos(p.pitch));
 cam.position.copy(eye);if(tp){cam.position.addScaledVector(fw,-4);cam.position.y=Math.max(cam.position.y,H(cam.position.x,cam.position.z)+.4)}cam.rotation.set(p.pitch,p.yaw,0);
 if(boat.on){boat.m.position.set(p.x,Math.sin(st.time*2)*.06,p.z);boat.m.rotation.y=p.yaw+Math.PI}hum.visible=tp;hum.position.set(p.x,p.y+(boat.on?.3:0),p.z);hum.rotation.y=p.yaw+Math.PI;const sw=Math.hypot(vx,vz)>.1&&!p.fly?Math.sin(st.time*9)*.7:0,U=hum.userData;U.l.rotation.x=sw;U.r.rotation.x=-sw;U.al.rotation.x=-sw;U.ar.rotation.x=sw;
 // animals
 for(const a of animals){const dx=p.x-a.g.position.x,dz=p.z-a.g.position.z,d=Math.hypot(dx,dz)||1;let vx2=0,vz2=0;
  if(a.t=='wolf'&&d<(night?16:8)&&!cr){vx2=dx/d*3.4;vz2=dz/d*3.4;if(d<1.7&&(a.bite=(a.bite||0)-dt)<=0){P.hp-=7;a.bite=1;toast('A wolf bites you!')}}
  else if(a.t=='deer'&&d<10){vx2=-dx/d*4.5;vz2=-dz/d*4.5}
  else{a.tm-=dt;if(a.tm<=0){a.tm=2+Math.random()*3;const r=Math.random()*6.28,m=Math.random()<.5?0:1.1;a.dx=Math.cos(r)*m;a.dz=Math.sin(r)*m}vx2=a.dx;vz2=a.dz}
  const ax=a.g.position.x+vx2*dt,az=a.g.position.z+vz2*dt;if(H(ax,az)>.6&&Math.abs(ax)<78&&Math.abs(az)<78){a.g.position.x=ax;a.g.position.z=az}a.g.position.y=H(a.g.position.x,a.g.position.z);
  const mv=Math.hypot(vx2,vz2);if(mv>.05)a.g.rotation.y=Math.atan2(vx2,vz2);a.ph=(a.ph||0)+dt*mv*3;a.legs.forEach((l,i)=>l.rotation.x=mv>.05?Math.sin(a.ph)*.7*(i==0||i==3?1:-1):0)}
 // survival
 if(!cr){const r=reg(p.x,p.z);P.hu=Math.max(0,P.hu-dt*(.3+(spr?.3:0)+(r.D>.3&&!night?.15:0)));P.sta=spr?Math.max(0,P.sta-18*dt):Math.min(100,P.sta+12*dt);
  if(r.S>.3&&!warm)P.hp-=dt*.8;if(P.hu<=0)P.hp-=dt*2;else if(P.hu>50&&P.hp<100)P.hp+=dt*1.2;if(P.hp<=0)die()}else{P={hp:100,hu:100,sta:100}}
 // target
 rc.set(eye,fw);rc.far=6;const hs=rc.intersectObjects([G.n,G.a,G.b,terrain],true);TG=null;cell=null;let tx='';
 if(hs.length){const h=hs[0];let o=h.object;while(o&&!o.userData.node&&!o.userData.an&&!o.userData.key)o=o.parent;
  if(o&&o.userData.node){TG={node:o.userData.node};tx='LMB: harvest '+D[o.userData.node.t].nm}
  else if(o&&o.userData.an){TG={an:o.userData.an};tx='LMB: attack '+o.userData.an.t}
  else if(o&&o.userData.key){TG={key:o.userData.key};tx='LMB: break block';const b=blocks.get(o.userData.key),n=h.face.normal;cell=[b.i+Math.round(n.x),b.j+Math.round(n.y),b.k+Math.round(n.z)]}

 const pl=!['cooked','berry'].includes(HB[sel])&&cell&&have(HB[sel]);pv.visible=!!pl;if(pl){pv.position.set(cell[0],cell[1]+.5,cell[2]);pv.material.color.set(valid(cell)?0x00ff66:0xff3333)}
 $('pr').textContent=tx;
 if((misT-=dt)<=0){misT=.5;mis();warm=false;for(const b of blocks.values())if(b.t=='torch'&&Math.hypot(b.i-p.x,b.k-p.z)<6&&Math.abs(b.j-p.y)<4){warm=true;break}}
 if((hudT-=dt)<=0){hudT=.1;hud()}}
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;if(state=='play')upd(dt);else if(state=='cut')cutTick(n);else if(state=='menu'){const t=n/6000;cam.position.set(Math.cos(t)*60,28,Math.sin(t)*60);cam.lookAt(0,0,0);sc.background=new T3.Color(0xaab6bf);sc.fog.color.set(0xaab6bf)}rd.render(sc,cam)}
setInterval(()=>{if(state=='play')save()},20000);
setG(1);reset();menu();requestAnimationFrame(loop);
